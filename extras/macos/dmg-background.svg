    <g fill="#bdd8d5" stroke="#e0efeb" stroke-opacity="0.35">
      <rect x="184" y="410" width="112" height="28" rx="7"/>
      <rect x="486" y="410" width="148" height="28" rx="7"/>
    </g>
  </g>
</svg>
