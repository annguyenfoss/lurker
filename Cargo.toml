[workspace]
members = [
    "crates/lurker-core",
    "crates/lurker-cli",
    "crates/lurker-helper",
    "apps/lurker-desktop",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
lurker-core = { path = "crates/lurker-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
slint = { version = "1.16", default-features = false, features = ["std", "compat-1-2", "backend-winit-wayland", "backend-winit-x11", "renderer-software", "renderer-skia"] }
slint-build = "1.16"
