[workspace]
members = [
    "crates/lurker-core",
    "crates/lurker-cli",
    "crates/lurker-helper",
    "apps/lurker-app/src-tauri",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"

[workspace.dependencies]
lurker-core = { path = "crates/lurker-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2" }
tauri-build = { version = "2" }
