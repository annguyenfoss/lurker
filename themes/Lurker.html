<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lurker — encrypted volume manager</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    /* Striking red accent — crimson on black/white */
    --accent-h: 25;
    --accent-c: 0.20;
    --accent:      oklch(55% var(--accent-c) var(--accent-h));
    --accent-2:    oklch(65% var(--accent-c) var(--accent-h));
    --accent-dim:  oklch(38% calc(var(--accent-c) * .6) var(--accent-h));
    --accent-soft: oklch(55% var(--accent-c) var(--accent-h) / .12);
    --accent-fg:   oklch(99% 0.005 var(--accent-h));

    --danger: oklch(58% 0.20 25);
    --warn:   oklch(70% 0.14 75);
    --ok:     oklch(60% 0.14 155);

    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --density: 1;
    --s1: calc(4px * var(--density));
    --s2: calc(8px * var(--density));
    --s3: calc(12px * var(--density));
    --s4: calc(16px * var(--density));
    --s5: calc(24px * var(--density));
    --s6: calc(32px * var(--density));

    --ui: "Inter Tight", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  /* Dark theme — true black with red punches */
  [data-theme="dark"]{
    --bg-0:   oklch(10% 0 0);
    --bg-1:   oklch(14% 0.004 25);
    --bg-2:   oklch(18% 0.006 25);
    --bg-3:   oklch(23% 0.008 25);
    --line:   oklch(28% 0.008 25 / .6);
    --line-strong: oklch(36% 0.010 25);
    --fg-0:   oklch(98% 0 0);
    --fg-1:   oklch(82% 0.004 25);
    --fg-2:   oklch(62% 0.006 25);
    --fg-3:   oklch(46% 0.008 25);
    --term-bg: oklch(6% 0 0);
    --titlebar-top: oklch(16% 0.004 25);
    --titlebar-bot: oklch(11% 0.004 25);
  }

  /* Light theme — pure white with red punches */
  [data-theme="light"]{
    --bg-0:   oklch(100% 0 0);
    --bg-1:   oklch(98% 0.002 25);
    --bg-2:   oklch(95% 0.004 25);
    --bg-3:   oklch(91% 0.006 25);
    --line:   oklch(82% 0.006 25 / .7);
    --line-strong: oklch(72% 0.008 25);
    --fg-0:   oklch(12% 0 0);
    --fg-1:   oklch(28% 0.006 25);
    --fg-2:   oklch(46% 0.008 25);
    --fg-3:   oklch(62% 0.010 25);
    --term-bg: oklch(18% 0.006 25);
    --titlebar-top: oklch(97% 0.004 25);
    --titlebar-bot: oklch(93% 0.006 25);
  }

    --radius: 10px;
    --radius-sm: 6px;
    --radius-lg: 14px;
    --density: 1;
    --s1: calc(4px * var(--density));
    --s2: calc(8px * var(--density));
    --s3: calc(12px * var(--density));
    --s4: calc(16px * var(--density));
    --s5: calc(24px * var(--density));
    --s6: calc(32px * var(--density));

    --ui: "Inter Tight", ui-sans-serif, system-ui, -apple-system, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%;background:var(--bg-0);color:var(--fg-0);font-family:var(--ui);-webkit-font-smoothing:antialiased}
  button{font-family:inherit}
  input,textarea,select{font-family:inherit;color:inherit}

  /* ─── App shell ─────────────────────────────────────────────── */
  .app{position:fixed;inset:0;display:flex;flex-direction:column;background:var(--bg-0);overflow:auto;min-width:1180px}

  .titlebar{
    height:32px;flex:none;display:flex;align-items:center;justify-content:space-between;
    padding:0 8px 0 12px;
    background:linear-gradient(180deg, var(--titlebar-top), var(--titlebar-bot));
    border-bottom:.5px solid var(--line);
    -webkit-app-region:drag;user-select:none;
    font-size:11.5px;color:var(--fg-2);letter-spacing:.02em;
  }
  .titlebar .tb-left{display:flex;align-items:center;gap:10px}
  .titlebar .tb-dot{width:8px;height:8px;border-radius:999px;background:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .titlebar .tb-title{font-weight:500;color:var(--fg-1)}
  .titlebar .tb-status{font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
  .titlebar .tb-ctrls{display:flex;gap:4px;-webkit-app-region:no-drag}
  .titlebar .tb-btn{width:26px;height:20px;border-radius:4px;border:0;background:transparent;color:var(--fg-2);display:grid;place-items:center;cursor:default}
  .titlebar .tb-btn:hover{background:var(--bg-3);color:var(--fg-0)}
  .titlebar .tb-btn.close:hover{background:var(--danger);color:white}

  .body{flex:1;min-height:0;display:grid;grid-template-columns:220px 1fr;gap:0}

  /* ─── Sidebar ───────────────────────────────────────────────── */
  .side{
    background:var(--bg-1);
    border-right:.5px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .brand{padding:var(--s5) var(--s4) var(--s4);display:flex;flex-direction:column;gap:var(--s2)}
  .brand-mark{display:flex;align-items:center;gap:10px}
  .brand-glyph{
    width:28px;height:28px;border-radius:8px;
    background:
      radial-gradient(circle at 30% 30%, var(--accent-2), var(--accent));
    display:grid;place-items:center;
    box-shadow: inset 0 0 0 .5px oklch(92% 0.05 var(--accent-h) / .5), 0 6px 18px oklch(30% var(--accent-c) var(--accent-h) / .35);
    position:relative;
  }
  .brand-glyph svg{width:14px;height:14px;color:var(--accent-fg)}
  .brand-name{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--fg-0)}
  .brand-tag{font-family:var(--mono);font-size:10px;color:var(--fg-3);letter-spacing:.04em;text-transform:uppercase}

  .nav-group{padding:var(--s3) var(--s2) var(--s1);display:flex;flex-direction:column;gap:2px}
  .nav-label{font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);padding:var(--s2) var(--s3) var(--s1)}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;
    color:var(--fg-1);font-size:13px;font-weight:500;cursor:default;position:relative;
    border:.5px solid transparent;
  }
  .nav-item:hover{background:var(--bg-2)}
  .nav-item[data-active="true"]{
    background:var(--accent-soft);
    border-color:var(--line-strong);
    color:var(--fg-0);
  }
  .nav-item[data-active="true"]::before{
    content:"";position:absolute;left:-1px;top:10px;bottom:10px;width:2px;border-radius:2px;background:var(--accent);
  }
  .nav-ico{width:14px;height:14px;color:var(--fg-2);flex:none}
  .nav-item[data-active="true"] .nav-ico{color:var(--accent)}
  .nav-kbd{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--fg-3);background:var(--bg-2);border:.5px solid var(--line);padding:1px 5px;border-radius:4px}
  .nav-item[data-active="true"] .nav-kbd{background:transparent}

  .side-foot{margin-top:auto;padding:var(--s3) var(--s4);border-top:.5px solid var(--line);display:flex;flex-direction:column;gap:var(--s1)}
  .foot-row{display:flex;align-items:center;justify-content:space-between;font-size:11px;color:var(--fg-2);font-family:var(--mono)}
  .foot-row .dot{width:6px;height:6px;border-radius:999px;background:var(--ok);box-shadow:0 0 0 3px oklch(60% 0.14 155 / .18)}

  /* ─── Main workspace ───────────────────────────────────────── */
  .main{display:flex;flex-direction:column;min-height:0;background:var(--bg-0);overflow:hidden}
  .main-hd{
    flex:none;padding:var(--s5) var(--s6) var(--s4);
    border-bottom:.5px solid var(--line);
  }
  .crumbs{display:flex;align-items:center;gap:6px;font-family:var(--mono);font-size:11px;color:var(--fg-3);margin-bottom:var(--s2)}
  .crumbs b{color:var(--fg-1);font-weight:500}
  .crumbs .sep{color:var(--fg-3);opacity:.6}
  .main-title{font-size:22px;font-weight:600;letter-spacing:-.02em;color:var(--fg-0);margin:0}
  .main-sub{margin:6px 0 0;font-size:13px;color:var(--fg-2);max-width:60ch;line-height:1.5}
  .main-hd .actions{display:flex;gap:6px;align-items:center}

  .chip{
    height:26px;padding:0 10px;border-radius:999px;border:.5px solid var(--line-strong);
    background:var(--bg-2);color:var(--fg-1);font-size:11.5px;font-weight:500;
    display:inline-flex;align-items:center;gap:6px;cursor:default;
  }
  .chip:hover{background:var(--bg-3)}
  .chip .k{font-family:var(--mono);color:var(--fg-3);font-size:10px}

  .icon-round{
    width:34px;height:34px;border-radius:999px;border:.5px solid var(--line-strong);
    background:var(--bg-2);color:var(--fg-1);
    display:inline-grid;place-items:center;cursor:default;padding:0;
    transition:background .12s, color .12s, border-color .12s;
  }
  .icon-round:hover{background:var(--bg-3);color:var(--fg-0)}
  .icon-round svg{width:15px;height:15px}

  .main-scroll{flex:1;min-height:0;overflow:auto;padding:var(--s5) var(--s6) var(--s6)}

  /* Centered content column — keeps inputs readable on wide/4K displays */
  .work-wrap{max-width:720px;margin:0 auto;width:100%}
  .main-hd .work-wrap{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}

  /* ─── Form card ────────────────────────────────────────────── */
  .card{
    background:var(--bg-1);border:.5px solid var(--line);border-radius:var(--radius-lg);
    overflow:hidden;
  }
  .card-section{padding:var(--s4) var(--s5)}
  .card-section + .card-section{border-top:.5px solid var(--line)}
  .sec-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:var(--s3)}
  .sec-title{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3)}
  .sec-hint{font-size:11px;color:var(--fg-3)}

  .field{display:flex;flex-direction:column;gap:6px;margin-bottom:var(--s4);min-width:0;max-width:100%}
  .field > *{max-width:100%;box-sizing:border-box}
  .field:last-child{margin-bottom:0}
  .field-row{display:grid;gap:var(--s4);grid-template-columns:1fr 1fr}
  .field-row.tri{grid-template-columns:1fr 1fr 1fr}
  .field-row > .field{min-width:0}
  .field-row > .field input,
  .field-row > .field .inp-wrap{min-width:0;width:100%}

  .lbl{display:flex;align-items:baseline;justify-content:space-between;gap:var(--s2)}
  .lbl-t{font-size:12px;font-weight:500;color:var(--fg-1)}
  .lbl-h{font-size:11px;color:var(--fg-3);font-family:var(--mono)}
  .lbl-req{color:var(--accent);font-size:10px;margin-left:6px;font-family:var(--mono)}

  .inp, .ta, .sel{
    width:100%;min-width:0;background:var(--bg-0);border:.5px solid var(--line-strong);border-radius:var(--radius-sm);
    padding:10px 12px;font-size:13px;color:var(--fg-0);outline:none;font-family:var(--mono);
    transition: border-color .15s, background .15s, box-shadow .15s;
  }
  .inp:focus, .ta:focus, .sel:focus{
    border-color:var(--accent);background:var(--bg-1);
    box-shadow:0 0 0 3px var(--accent-soft);
  }
  .inp::placeholder,.ta::placeholder{color:var(--fg-3)}
  .ta{min-height:96px;resize:vertical;line-height:1.5}

  .inp-wrap{position:relative}
  .inp-wrap .prefix{position:absolute;left:10px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:12px;color:var(--fg-3);pointer-events:none}
  .inp-wrap .suffix{position:absolute;right:6px;top:50%;transform:translateY(-50%);display:flex;gap:2px}
  .inp-wrap .inp.has-prefix{padding-left:26px}

  .icon-btn{
    width:26px;height:26px;border-radius:5px;border:0;background:transparent;color:var(--fg-2);
    display:grid;place-items:center;cursor:default;
  }
  .icon-btn:hover{background:var(--bg-3);color:var(--fg-0)}
  .icon-btn svg{width:13px;height:13px}

  .drop{
    border:1px dashed var(--line-strong);border-radius:var(--radius);
    padding:var(--s5) var(--s4);display:flex;flex-direction:column;align-items:center;gap:var(--s2);
    background:var(--bg-0);
    cursor:default;transition:border-color .15s, background .15s;
  }
  .drop:hover,.drop[data-drag="true"]{border-color:var(--accent);background:var(--bg-1)}
  .drop-t{font-size:13px;color:var(--fg-1);font-weight:500}
  .drop-s{font-size:11.5px;color:var(--fg-3);font-family:var(--mono)}
  .drop svg{width:22px;height:22px;color:var(--fg-2)}

  /* Segmented */
  .seg{display:inline-flex;background:var(--bg-0);border:.5px solid var(--line-strong);border-radius:8px;padding:3px;gap:2px}
  .seg button{
    appearance:none;border:0;background:transparent;color:var(--fg-2);font-size:12px;font-weight:500;
    padding:6px 14px;border-radius:6px;cursor:default;font-family:inherit;min-width:80px;
  }
  .seg button:hover{color:var(--fg-0)}
  .seg button[data-on="true"]{
    background:var(--bg-2);color:var(--fg-0);
    box-shadow:inset 0 0 0 .5px var(--line-strong);
  }

  /* Slider */
  .slider{display:flex;align-items:center;gap:var(--s3);min-width:0;
    background:var(--bg-0);border:.5px solid var(--line-strong);border-radius:var(--radius-sm);
    padding:12px 14px;min-height:40px}
  .slider input[type=range]{
    -webkit-appearance:none;appearance:none;flex:1;min-width:0;width:100%;height:4px;background:var(--bg-3);border-radius:999px;outline:none;
  }
  .slider input[type=range]::-webkit-slider-thumb{
    -webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:999px;background:var(--accent);
    border:2px solid var(--bg-0);box-shadow:0 0 0 3px var(--accent-soft);cursor:default;
  }
  .slider-val{font-family:var(--mono);font-size:12px;color:var(--fg-1);min-width:70px;text-align:right}

  /* Strength meter */
  .meter{display:flex;gap:3px;height:4px}
  .meter i{flex:1;background:var(--bg-3);border-radius:2px}
  .meter i[data-on="1"]{background:var(--danger)}
  .meter i[data-on="2"]{background:var(--warn)}
  .meter i[data-on="3"]{background:var(--accent)}
  .meter i[data-on="4"]{background:var(--ok)}

  /* Buttons */
  .btn{
    appearance:none;border:0;font-family:inherit;font-size:12.5px;font-weight:500;
    height:32px;padding:0 14px;border-radius:8px;cursor:default;
    display:inline-flex;align-items:center;gap:8px;letter-spacing:.005em;
  }
  .btn svg{width:13px;height:13px}
  .btn-ghost{background:transparent;color:var(--fg-1)}
  .btn-ghost:hover{background:var(--bg-2)}
  .btn-secondary{background:var(--bg-2);color:var(--fg-0);border:.5px solid var(--line-strong)}
  .btn-secondary:hover{background:var(--bg-3)}
  .btn-primary{
    background:linear-gradient(180deg, var(--accent-2), var(--accent));
    color:var(--accent-fg);font-weight:600;
    box-shadow: inset 0 .5px 0 oklch(70% var(--accent-c) var(--accent-h) / .6), 0 4px 16px oklch(35% var(--accent-c) var(--accent-h) / .35);
  }
  .btn-primary:hover{background:linear-gradient(180deg, oklch(60% var(--accent-c) var(--accent-h)), oklch(46% var(--accent-c) var(--accent-h)))}
  .btn-primary:disabled{opacity:.5;cursor:not-allowed}
  .btn-danger{background:transparent;color:var(--danger);border:.5px solid oklch(50% 0.12 25)}
  .btn-danger:hover{background:oklch(58% 0.18 25 / .12)}

  .btn-kbd{font-family:var(--mono);font-size:10px;opacity:.7;border-left:.5px solid currentColor;padding-left:8px;margin-left:2px}

  /* Foot */
  .card-foot{
    display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
    padding:var(--s3) var(--s5);background:var(--bg-0);border-top:.5px solid var(--line);
  }
  .foot-hint{font-size:11.5px;color:var(--fg-3);font-family:var(--mono);display:flex;align-items:center;gap:8px}
  .foot-actions{display:flex;gap:8px}

  /* ─── Right panel ─────────────────────────────────────────── */
  .right{
    background:var(--bg-1);border-left:.5px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .right-hd{padding:var(--s4) var(--s4) var(--s3);display:flex;align-items:center;justify-content:space-between}
  .right-hd-t{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2)}
  .right-count{font-family:var(--mono);font-size:11px;color:var(--fg-3);background:var(--bg-2);border:.5px solid var(--line);border-radius:999px;padding:1px 7px}

  .right-list{flex:1;overflow:auto;padding:0 var(--s3) var(--s3);display:flex;flex-direction:column;gap:var(--s2)}

  .vol{
    background:var(--bg-2);border:.5px solid var(--line);border-radius:var(--radius);
    padding:var(--s3);cursor:default;position:relative;transition:border-color .15s, background .15s;
  }
  .vol:hover{border-color:var(--line-strong);background:var(--bg-3)}
  .vol[data-selected="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px var(--accent-soft)}

  .vol-top{display:flex;align-items:center;gap:8px}
  .vol-icon{width:24px;height:24px;border-radius:6px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent);flex:none}
  .vol-icon svg{width:12px;height:12px}
  .vol-name{font-size:12.5px;font-weight:600;color:var(--fg-0);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-family:var(--mono)}
  .vol-state{font-family:var(--mono);font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ok);display:flex;align-items:center;gap:4px}
  .vol-state .dot{width:5px;height:5px;border-radius:999px;background:currentColor}

  .vol-meta{margin-top:8px;display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:10.5px;color:var(--fg-3)}
  .vol-meta div{display:flex;gap:6px}
  .vol-meta div b{color:var(--fg-2);font-weight:500;min-width:52px;display:inline-block}

  .vol-bar{margin-top:8px;height:3px;background:var(--bg-3);border-radius:999px;overflow:hidden}
  .vol-bar i{display:block;height:100%;background:linear-gradient(90deg, var(--accent-dim), var(--accent));border-radius:999px}

  .vol-empty{padding:var(--s6) var(--s4);text-align:center;color:var(--fg-3);font-size:12px;line-height:1.5}
  .vol-empty svg{width:28px;height:28px;margin:0 auto var(--s2);color:var(--fg-3);display:block;opacity:.5}

  /* Activity log */
  .log{
    border-top:.5px solid var(--line);
    padding:var(--s3) var(--s4) var(--s4);
    flex:none;max-height:180px;overflow:auto;
  }
  .log-hd{font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-2);margin-bottom:var(--s2)}
  .log ol{list-style:none;padding:0;margin:0;display:flex;flex-direction:column;gap:4px}
  .log li{font-family:var(--mono);font-size:10.5px;color:var(--fg-2);display:flex;gap:8px;line-height:1.5}
  .log li .t{color:var(--fg-3);flex:none}
  .log li .m{color:var(--fg-1)}
  .log li[data-kind="ok"] .m::before{content:"✓ ";color:var(--ok)}
  .log li[data-kind="err"] .m::before{content:"✗ ";color:var(--danger)}
  .log li[data-kind="info"] .m::before{content:"› ";color:var(--accent)}

  /* Toast */
  .toasts{position:fixed;right:340px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:999;pointer-events:none}
  .toast{
    pointer-events:auto;background:var(--bg-2);border:.5px solid var(--line-strong);
    border-radius:10px;padding:10px 14px;min-width:260px;
    display:flex;align-items:center;gap:10px;
    box-shadow: 0 12px 40px rgba(0,0,0,.4);
    animation:toastIn .2s ease-out;
  }
  @keyframes toastIn{from{opacity:0;transform:translateY(8px)}}
  .toast .dot{width:8px;height:8px;border-radius:999px;background:var(--ok);flex:none}
  .toast[data-kind="err"] .dot{background:var(--danger)}
  .toast[data-kind="info"] .dot{background:var(--accent)}
  .toast .t{font-size:12.5px;color:var(--fg-0);font-weight:500}

// ── useTweaks ───────────────────────────────────────────────────────────────
// Single source of truth for tweak values. setTweak persists via the host
// (__edit_mode_set_keys → host rewrites the EDITMODE block on disk).
function useTweaks(defaults) {
  const [values, setValues] = React.useState(defaults);
  const setTweak = React.useCallback((key, val) => {
    setValues((prev) => ({ ...prev, [key]: val }));
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');
  }, []);
  return [values, setTweak];
}

// ── TweaksPanel ─────────────────────────────────────────────────────────────
// Floating shell. Registers the protocol listener BEFORE announcing
// availability — if the announce ran first, the host's activate could land
// before our handler exists and the toolbar toggle would silently no-op.
// The close button posts __edit_mode_dismissed so the host's toolbar toggle
// flips off in lockstep; the host echoes __deactivate_edit_mode back which
// is what actually hides the panel.
function TweaksPanel({ title = 'Tweaks', children }) {
  const [open, setOpen] = React.useState(false);
  const dragRef = React.useRef(null);
  const offsetRef = React.useRef({ x: 16, y: 16 });
  const PAD = 16;

  const clampToViewport = React.useCallback(() => {
    const panel = dragRef.current;
    if (!panel) return;
    const w = panel.offsetWidth, h = panel.offsetHeight;
    const maxRight = Math.max(PAD, window.innerWidth - w - PAD);
    const maxBottom = Math.max(PAD, window.innerHeight - h - PAD);
    offsetRef.current = {
      x: Math.min(maxRight, Math.max(PAD, offsetRef.current.x)),
      y: Math.min(maxBottom, Math.max(PAD, offsetRef.current.y)),
    };
    panel.style.right = offsetRef.current.x + 'px';
    panel.style.bottom = offsetRef.current.y + 'px';
  }, []);

  React.useEffect(() => {
    if (!open) return;
    clampToViewport();
    if (typeof ResizeObserver === 'undefined') {
      window.addEventListener('resize', clampToViewport);
      return () => window.removeEventListener('resize', clampToViewport);
    }
    const ro = new ResizeObserver(clampToViewport);
    ro.observe(document.documentElement);
    return () => ro.disconnect();
  }, [open, clampToViewport]);

  React.useEffect(() => {
    const onMsg = (e) => {
      const t = e?.data?.type;
      if (t === '__activate_edit_mode') setOpen(true);
      else if (t === '__deactivate_edit_mode') setOpen(false);
    };
    window.addEventListener('message', onMsg);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', onMsg);
  }, []);

  const dismiss = () => {
    setOpen(false);
    window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');
  };

  const onDragStart = (e) => {
    const panel = dragRef.current;
    if (!panel) return;
    const r = panel.getBoundingClientRect();
    const sx = e.clientX, sy = e.clientY;
    const startRight = window.innerWidth - r.right;
    const startBottom = window.innerHeight - r.bottom;
    const move = (ev) => {
      offsetRef.current = {
        x: startRight - (ev.clientX - sx),
        y: startBottom - (ev.clientY - sy),
      };
      clampToViewport();
    };
    const up = () => {
      window.removeEventListener('mousemove', move);
      window.removeEventListener('mouseup', up);
    };
    window.addEventListener('mousemove', move);
    window.addEventListener('mouseup', up);
  };

  if (!open) return null;
  return (
    <>
      <style>{__TWEAKS_STYLE}</style>
      <div ref={dragRef} className="twk-panel"
           style={{ right: offsetRef.current.x, bottom: offsetRef.current.y }}>
        <div className="twk-hd" onMouseDown={onDragStart}>
          <b>{title}</b>
          <button className="twk-x" aria-label="Close tweaks"
                  onMouseDown={(e) => e.stopPropagation()}
                  onClick={dismiss}>✕</button>
        </div>
        <div className="twk-body">{children}</div>
      </div>
    </>
  );
}

// ── Layout helpers ──────────────────────────────────────────────────────────

function TweakSection({ label, children }) {
  return (
    <>
      <div className="twk-sect">{label}</div>
      {children}
    </>
  );
}

function TweakRow({ label, value, children, inline = false }) {
  return (
    <div className={inline ? 'twk-row twk-row-h' : 'twk-row'}>
      <div className="twk-lbl">
        <span>{label}</span>
        {value != null && <span className="twk-val">{value}</span>}
      </div>
      {children}
    </div>
  );
}

// ── Controls ────────────────────────────────────────────────────────────────

function TweakSlider({ label, value, min = 0, max = 100, step = 1, unit = '', onChange }) {
  return (
    <TweakRow label={label} value={`${value}${unit}`}>
      <input type="range" className="twk-slider" min={min} max={max} step={step}
             value={value} onChange={(e) => onChange(Number(e.target.value))} />
    </TweakRow>
  );
}

function TweakToggle({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <button type="button" className="twk-toggle" data-on={value ? '1' : '0'}
              role="switch" aria-checked={!!value}
              onClick={() => onChange(!value)}><i /></button>
    </div>
  );
}

function TweakRadio({ label, value, options, onChange }) {
  const trackRef = React.useRef(null);
  const [dragging, setDragging] = React.useState(false);
  const opts = options.map((o) => (typeof o === 'object' ? o : { value: o, label: o }));
  const idx = Math.max(0, opts.findIndex((o) => o.value === value));
  const n = opts.length;

  // The active value is read by pointer-move handlers attached for the lifetime
  // of a drag — ref it so a stale closure doesn't fire onChange for every move.
  const valueRef = React.useRef(value);
  valueRef.current = value;

  const segAt = (clientX) => {
    const r = trackRef.current.getBoundingClientRect();
    const inner = r.width - 4;
    const i = Math.floor(((clientX - r.left - 2) / inner) * n);
    return opts[Math.max(0, Math.min(n - 1, i))].value;
  };

  const onPointerDown = (e) => {
    setDragging(true);
    const v0 = segAt(e.clientX);
    if (v0 !== valueRef.current) onChange(v0);
    const move = (ev) => {
      if (!trackRef.current) return;
      const v = segAt(ev.clientX);
      if (v !== valueRef.current) onChange(v);
    };
    const up = () => {
      setDragging(false);
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };

  return (
    <TweakRow label={label}>
      <div ref={trackRef} role="radiogroup" onPointerDown={onPointerDown}
           className={dragging ? 'twk-seg dragging' : 'twk-seg'}>
        <div className="twk-seg-thumb"
             style={{ left: `calc(2px + ${idx} * (100% - 4px) / ${n})`,
                      width: `calc((100% - 4px) / ${n})` }} />
        {opts.map((o) => (
          <button key={o.value} type="button" role="radio" aria-checked={o.value === value}>
            {o.label}
          </button>
        ))}
      </div>
    </TweakRow>
  );
}

function TweakSelect({ label, value, options, onChange }) {
  return (
    <TweakRow label={label}>
      <select className="twk-field" value={value} onChange={(e) => onChange(e.target.value)}>
        {options.map((o) => {
          const v = typeof o === 'object' ? o.value : o;
          const l = typeof o === 'object' ? o.label : o;
          return <option key={v} value={v}>{l}</option>;
        })}
      </select>
    </TweakRow>
  );
}

function TweakText({ label, value, placeholder, onChange }) {
  return (
    <TweakRow label={label}>
      <input className="twk-field" type="text" value={value} placeholder={placeholder}
             onChange={(e) => onChange(e.target.value)} />
    </TweakRow>
  );
}

function TweakNumber({ label, value, min, max, step = 1, unit = '', onChange }) {
  const clamp = (n) => {
    if (min != null && n < min) return min;
    if (max != null && n > max) return max;
    return n;
  };
  const startRef = React.useRef({ x: 0, val: 0 });
  const onScrubStart = (e) => {
    e.preventDefault();
    startRef.current = { x: e.clientX, val: value };
    const decimals = (String(step).split('.')[1] || '').length;
    const move = (ev) => {
      const dx = ev.clientX - startRef.current.x;
      const raw = startRef.current.val + dx * step;
      const snapped = Math.round(raw / step) * step;
      onChange(clamp(Number(snapped.toFixed(decimals))));
    };
    const up = () => {
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', up);
    };
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', up);
  };
  return (
    <div className="twk-num">
      <span className="twk-num-lbl" onPointerDown={onScrubStart}>{label}</span>
      <input type="number" value={value} min={min} max={max} step={step}
             onChange={(e) => onChange(clamp(Number(e.target.value)))} />
      {unit && <span className="twk-num-unit">{unit}</span>}
    </div>
  );
}

function TweakColor({ label, value, onChange }) {
  return (
    <div className="twk-row twk-row-h">
      <div className="twk-lbl"><span>{label}</span></div>
      <input type="color" className="twk-swatch" value={value}
             onChange={(e) => onChange(e.target.value)} />
    </div>
  );
}

function TweakButton({ label, onClick, secondary = false }) {
  return (
    <button type="button" className={secondary ? 'twk-btn secondary' : 'twk-btn'}
            onClick={onClick}>{label}</button>
  );
}

Object.assign(window, {
  useTweaks, TweaksPanel, TweakSection, TweakRow,
  TweakSlider, TweakToggle, TweakRadio, TweakSelect,
  TweakText, TweakNumber, TweakColor, TweakButton,
});

/* ─── views.jsx ────────────────────────────────────────────── */
// views.jsx — Create / Mount / Unmount flow bodies
// Stateless UI. The only stateful thing globally is the mounted-volume list.
const { useState, useEffect, useMemo, useRef } = React;

/* ─── Shared primitives ─────────────────────────────────────────── */

function Field({ label, hint, required, children }) {
  return (
    <div className="field">
      <div className="lbl">
        <span className="lbl-t">{label}{required && <span className="lbl-req">required</span>}</span>
        {hint && <span className="lbl-h">{hint}</span>}
      </div>
      {children}
    </div>
  );
}

function Segmented({ value, onChange, options }) {
  return (
    <div className="seg">
      {options.map(o => (
        <button key={o.value} data-on={value === o.value} onClick={() => onChange(o.value)}>{o.label}</button>
      ))}
    </div>
  );
}

function Toggle({ label, hint, value, onChange }) {
  return (
    <label style={{display:"flex",alignItems:"center",gap:12,cursor:"default"}} onClick={()=>onChange(!value)}>
      <span style={{
        width:32,height:18,borderRadius:999,
        background: value ? "var(--accent)" : "var(--bg-3)",
        border:".5px solid var(--line-strong)",
        position:"relative",flex:"none",transition:"background .15s"
      }}>
        <span style={{
          position:"absolute",top:1.5,left: value?15:1.5,
          width:13,height:13,borderRadius:999,
          background:"var(--bg-0)",
          transition:"left .15s",
          boxShadow:"0 1px 3px rgba(0,0,0,.5)"
        }}/>
      </span>
      <span style={{display:"flex",flexDirection:"column",gap:2}}>
        <span style={{fontSize:12.5,fontWeight:500,color:"var(--fg-1)"}}>{label}</span>
        {hint && <span style={{fontSize:11,color:"var(--fg-3)",fontFamily:"var(--mono)"}}>{hint}</span>}
      </span>
    </label>
  );
}

function PassphraseInput({ value, onChange, placeholder = "enter a strong passphrase", showStrength = true }) {
  const [show, setShow] = useState(false);
  const score = useMemo(() => {
    let s = 0;
    if (value.length >= 8) s++;
    if (value.length >= 14) s++;
    if (/[A-Z]/.test(value) && /[a-z]/.test(value)) s++;
    if (/\d/.test(value) && /[^\w\s]/.test(value)) s++;
    return s;
  }, [value]);
  return (
    <div>
      <div className="inp-wrap">
        <input
          className="inp"
          type={show ? "text" : "password"}
          value={value}
          placeholder={placeholder}
          onChange={e => onChange(e.target.value)}
          spellCheck={false}
          autoComplete="off"
        />
        <div className="suffix">
          <button className="icon-btn" title={show ? "Hide" : "Show"} onClick={() => setShow(s => !s)}>
            {show ? <Icon.EyeOff/> : <Icon.Eye/>}
          </button>
          {showStrength && (
            <button className="icon-btn" title="Generate diceware"
              onClick={() => {
                const words = ["forest","ember","harbor","gravel","lucid","orbit","thistle","wren","basalt","marrow","quartz","syntax"];
                const p = Array.from({length:5},()=>words[Math.floor(Math.random()*words.length)]).join("-") + "-" + Math.floor(Math.random()*99);
                onChange(p);
              }}>
              <Icon.Dice/>
            </button>
          )}
        </div>
      </div>

    </div>
  );
}

function KeyFilePicker({ value, onChange }) {
  return value ? (
    <div className="inp-wrap">
      <span className="prefix"><Icon.Key/></span>
      <input className="inp has-prefix" style={{paddingLeft:30}} value={value} onChange={e => onChange(e.target.value)} spellCheck={false}/>
      <div className="suffix">
        <button className="icon-btn" title="Clear" onClick={() => onChange("")}><Icon.X/></button>
      </div>
    </div>
  ) : (
    <div
      className="drop"
      style={{padding:"18px 16px"}}
      onClick={() => onChange("~/.lurker/keys/archive.key")}
    >
      <Icon.Key/>
      <div className="drop-t">Select a key file</div>
      <div className="drop-s">drop a file here or click to browse</div>
    </div>
  );
}

/* Auth block used by Mount & Unmount: toggle between passphrase and keyfile */
function AuthBlock({ method, onMethod, pass, onPass, keyfile, onKey, showStrength = true }) {
  return (
    <div>
      <div style={{marginBottom:10}}>
        <Segmented value={method} onChange={onMethod} options={[
          {value:"pass", label:"Passphrase"},
          {value:"key",  label:"Key file"},
        ]}/>
      </div>
      {method === "pass" ? (
        <PassphraseInput value={pass} onChange={onPass} showStrength={showStrength}/>
      ) : (
        <KeyFilePicker value={keyfile} onChange={onKey}/>
      )}
    </div>
  );
}

/* ─── CREATE ────────────────────────────────────────────────────── */

function CreateView({ backend, onCreate }) {
  const isLinux = backend === "linux";
  const [targetKind, setTargetKind] = useState("file"); // "file" | "partition"
  const [format, setFormat] = useState(isLinux ? "luks" : "vera"); // linux: luks|vera ; mac: vera|apple
  const [filePath, setFilePath] = useState("~/vaults/");
  const [fileName, setFileName] = useState(isLinux ? "archive.luks" : "archive.dmg");
  const [partition, setPartition] = useState(isLinux ? "/dev/sdb1" : "/dev/disk2s1");
  const [size, setSize] = useState("1.0");
  const [sizeUnit, setSizeUnit] = useState("GB");
  const [cipher, setCipher] = useState("aes");
  const [pass, setPass] = useState("");
  const [confirm, setConfirm] = useState("");

  useEffect(() => {
    setFormat(isLinux ? "luks" : "vera");
    setFileName(f => {
      if (isLinux && f.endsWith(".dmg")) return "archive.luks";
      if (!isLinux && f.endsWith(".luks")) return "archive.dmg";
      return f;
    });
    setPartition(isLinux ? "/dev/sdb1" : "/dev/disk2s1");
  }, [backend]);

  const full = targetKind === "file"
    ? filePath.replace(/\/?$/, "/") + fileName
    : partition;

  const passMatch = pass.length > 0 && pass === confirm;
  const canSubmit = (targetKind === "file" ? fileName.trim() : partition.trim()) && pass.length >= 8 && passMatch;

  const sizeLabel = `${size} ${sizeUnit}`;

  return (
    <div className="card">
      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Format</div>
          <div className="sec-hint">first is default</div>
        </div>
        <Segmented value={format} onChange={setFormat} options={isLinux
          ? [{value:"luks",label:"LUKS"},{value:"vera",label:"VeraCrypt"}]
          : [{value:"vera",label:"VeraCrypt"},{value:"apple",label:"Apple Encryption"}]
        }/>
      </div>

      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Target</div>
          <div className="sec-hint">file or partition</div>
        </div>
        <div style={{marginBottom:"var(--s3)"}}>
          <Segmented value={targetKind} onChange={setTargetKind} options={[
            {value:"file",      label:"File container"},
            {value:"partition", label:"Partition / disk"},
          ]}/>
        </div>

        {targetKind === "file" ? (
          <>
            <Field label="Location" required>
              <div className="inp-wrap">
                <input className="inp" value={filePath} onChange={e => setFilePath(e.target.value)} spellCheck={false}/>
                <div className="suffix"><button className="icon-btn" title="Pick folder"><Icon.Folder/></button></div>
              </div>
            </Field>
            <div className="field-row">
              <Field label="Filename" required>
                <input className="inp" style={{width:"100%",minWidth:0}} value={fileName} onChange={e => setFileName(e.target.value)} spellCheck={false}/>
              </Field>
              <Field label="Size" required>
                <div style={{display:"flex",gap:"var(--s2)",width:"100%",minWidth:0}}>
                  <input className="inp" style={{flex:"1 1 0",minWidth:0,width:"100%"}} type="text" inputMode="decimal"
                    value={size} onChange={e => setSize(e.target.value)} spellCheck={false}/>
                  <select className="sel" style={{width:80,flex:"0 0 80px"}} value={sizeUnit} onChange={e => setSizeUnit(e.target.value)}>
                    <option value="MB">MB</option>
                    <option value="GB">GB</option>
                  </select>
                </div>
              </Field>
            </div>
          </>
        ) : (
          <>
            <Field label="Partition" required>
              <div className="inp-wrap">
                <span className="prefix"><Icon.Drive/></span>
                <input className="inp has-prefix" style={{paddingLeft:30}} value={partition} onChange={e => setPartition(e.target.value)} spellCheck={false}/>
                <div className="suffix"><button className="icon-btn" title="List devices"><Icon.Refresh/></button></div>
              </div>
            </Field>
            <div style={{
              display:"flex",gap:10,padding:"10px 12px",
              background:"oklch(58% 0.18 25 / .1)",borderRadius:"var(--radius-sm)",
              border:".5px solid oklch(58% 0.18 25 / .35)",fontSize:11.5,color:"var(--fg-1)",
              fontFamily:"var(--mono)",lineHeight:1.5,marginTop:"var(--s3)"
            }}>
              <span style={{color:"var(--danger)",flex:"none"}}><Icon.Info/></span>
              <span>All data on <b style={{color:"var(--fg-0)"}}>{partition}</b> will be erased.</span>
            </div>
          </>
        )}
      </div>

      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Cipher</div>
          <div className="sec-hint">pick one — the rest is handled for you</div>
        </div>
        <Segmented value={cipher} onChange={setCipher} options={[
          {value:"aes",     label:"AES"},
          {value:"serpent", label:"Serpent"},
          {value:"twofish", label:"Twofish"},
        ]}/>
      </div>

      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Passphrase</div>
          <div className="sec-hint">min 8 characters</div>
        </div>
        <Field label="Passphrase" required>
          <PassphraseInput value={pass} onChange={setPass}/>
        </Field>
        <Field label="Confirm">
          <div className="inp-wrap">
            <input
              className="inp"
              type="password"
              value={confirm}
              onChange={e => setConfirm(e.target.value)}
              placeholder="retype to confirm"
              spellCheck={false}
              autoComplete="off"
            />
            {confirm.length > 0 && (
              <div className="suffix">
                <span style={{
                  fontSize:10.5,fontFamily:"var(--mono)",padding:"0 8px",
                  color: passMatch ? "var(--ok)" : "var(--danger)"
                }}>{passMatch ? "matches" : "mismatch"}</span>
              </div>
            )}
          </div>
        </Field>
      </div>

      <div className="card-foot">
        <div className="foot-hint"></div>
        <div className="foot-actions">
          <button className="btn btn-primary" disabled={!canSubmit} onClick={() => {
            onCreate({ target: full, kind: targetKind, size: targetKind === "file" ? sizeLabel : "—", cipher });
            setPass(""); setConfirm("");
          }}>
            <Icon.Plus/> Create <span className="btn-kbd">⌘⏎</span>
          </button>
        </div>
      </div>
    </div>
  );
}



/* ─── MOUNT ────────────────────────────────────────────────────── */

function MountView({ backend, onMount }) {
  const isLinux = backend === "linux";
  const [sourceKind, setSourceKind] = useState("file"); // "file" | "partition"
  const [source, setSource] = useState("");
  const [mount, setMount] = useState(isLinux ? "/mnt/" : "/Volumes/");
  const [method, setMethod] = useState("pass");
  const [pass, setPass] = useState("");
  const [keyfile, setKeyfile] = useState("");
  const [readonly, setReadonly] = useState(false);
  const [drag, setDrag] = useState(false);

  const hasAuth = method === "pass" ? pass.length > 0 : keyfile.length > 0;
  const canSubmit = source && hasAuth && mount.replace(/\/?$/, "") !== (isLinux ? "/mnt" : "/Volumes");

  useEffect(() => {
    // adjust default mount base when backend swaps
    setMount(m => {
      if (isLinux && m.startsWith("/Volumes")) return "/mnt/";
      if (!isLinux && m.startsWith("/mnt")) return "/Volumes/";
      return m;
    });
  }, [backend]);

  return (
    <div className="card">
      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Source</div>
          <div className="sec-hint">encrypted file or partition to unlock</div>
        </div>

        <div style={{marginBottom:"var(--s3)"}}>
          <Segmented value={sourceKind} onChange={v => { setSourceKind(v); setSource(""); }} options={[
            {value:"file",      label:"File container"},
            {value:"partition", label:"Partition / disk"},
          ]}/>
        </div>

        {sourceKind === "file" ? (
          !source ? (
            <div
              className="drop"
              data-drag={drag}
              onDragOver={e => { e.preventDefault(); setDrag(true); }}
              onDragLeave={() => setDrag(false)}
              onDrop={e => { e.preventDefault(); setDrag(false); const f = e.dataTransfer.files[0]; if (f) setSource(f.name.startsWith("/")?f.name:`~/${f.name}`); }}
              onClick={() => setSource(isLinux ? "~/vaults/archive.luks" : "~/vaults/archive.dmg")}
            >
              <Icon.File/>
              <div className="drop-t">Drop a container file here</div>
              <div className="drop-s">or click to browse · LUKS, VeraCrypt{!isLinux && ", DMG"}</div>
            </div>
          ) : (
            <div className="inp-wrap">
              <span className="prefix"><Icon.File/></span>
              <input className="inp has-prefix" style={{paddingLeft:30}} value={source} onChange={e => setSource(e.target.value)}/>
              <div className="suffix">
                <button className="icon-btn" title="Clear" onClick={() => setSource("")}><Icon.X/></button>
              </div>
            </div>
          )
        ) : (
          <div className="inp-wrap">
            <span className="prefix"><Icon.Drive/></span>
            <input
              className="inp has-prefix"
              style={{paddingLeft:30}}
              value={source}
              placeholder={isLinux ? "/dev/sdb1" : "/dev/disk2s1"}
              onChange={e => setSource(e.target.value)}
            />
            <div className="suffix"><button className="icon-btn" title="List devices"><Icon.Refresh/></button></div>
          </div>
        )}
      </div>

      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Unlock with</div>
          <div className="sec-hint">passphrase or key file</div>
        </div>
        <AuthBlock
          method={method} onMethod={setMethod}
          pass={pass} onPass={setPass}
          keyfile={keyfile} onKey={setKeyfile}
          showStrength={false}
        />
      </div>

      <div className="card-section">
        <div className="sec-head"><div className="sec-title">Mount</div></div>
        <Field label="Mount point" hint={isLinux ? "/mnt/…" : "/Volumes/…"} required>
          <input className="inp" value={mount} onChange={e => setMount(e.target.value)}/>
        </Field>
        <Toggle label="Mount read-only" hint="safe for inspection · prevents writes" value={readonly} onChange={setReadonly}/>
      </div>

      <div className="card-foot">
        <div className="foot-hint"></div>
        <div className="foot-actions">
          <button className="btn btn-ghost">Reset</button>
          <button className="btn btn-primary" disabled={!canSubmit} onClick={() => {
            const baseName = source.split("/").pop().replace(/\.[^.]+$/,"") || "volume";
            onMount({
              id: "v" + Math.random().toString(36).slice(2,6),
              name: baseName,
              source, mount, readonly,
              method,
              sourceKind,
            });
            setPass(""); setKeyfile("");
          }}>
            <Icon.LockOpen/> Unlock &amp; mount <span className="btn-kbd">⌘⏎</span>
          </button>
        </div>
      </div>
    </div>
  );
}

/* ─── UNMOUNT ──────────────────────────────────────────────────── */

function UnmountView({ volumes, selectedId, onSelect, onUnmount, backend }) {
  const sel = volumes.find(v => v.id === selectedId);

  if (volumes.length === 0) {
    return (
      <div className="card">
        <div className="card-section" style={{padding:"var(--s6) var(--s5)",textAlign:"center"}}>
          <div style={{
            width:48,height:48,borderRadius:12,margin:"0 auto var(--s3)",
            background:"var(--bg-2)",display:"grid",placeItems:"center",color:"var(--fg-3)"
          }}>
            <Icon.Lock/>
          </div>
          <div style={{fontSize:15,fontWeight:600,color:"var(--fg-0)",marginBottom:6}}>Nothing to unmount</div>
          <div style={{fontSize:12.5,color:"var(--fg-2)",maxWidth:"40ch",margin:"0 auto",lineHeight:1.5}}>
            No volumes are currently mounted. Open a container from the <b style={{color:"var(--fg-1)"}}>Mount</b> tab to get started.
          </div>
        </div>
      </div>
    );
  }

  return (
    <div className="card">
      <div className="card-section">
        <div className="sec-head">
          <div className="sec-title">Pick a volume</div>
          <div className="sec-hint">{volumes.length} mounted</div>
        </div>
        <div style={{display:"flex",flexDirection:"column",gap:8}}>
          {volumes.map(v => (
            <div
              key={v.id}
              onClick={() => onSelect(v.id)}
              style={{
                display:"grid",gridTemplateColumns:"auto 1fr auto",gap:14,alignItems:"center",
                padding:"12px 14px",
                background: selectedId === v.id ? "var(--accent-soft)" : "var(--bg-0)",
                border:".5px solid " + (selectedId === v.id ? "var(--accent)" : "var(--line-strong)"),
                borderRadius:"var(--radius)",cursor:"default",
                transition:"background .12s, border-color .12s",
              }}
            >
              <div style={{
                width:32,height:32,borderRadius:8,background:"var(--accent-soft)",
                display:"grid",placeItems:"center",color:"var(--accent-2)"
              }}><Icon.LockOpen/></div>
              <div style={{minWidth:0}}>
                <div style={{fontFamily:"var(--mono)",fontSize:13,fontWeight:600,color:"var(--fg-0)",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.name}</div>
                <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--fg-3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                  {v.source} <span style={{opacity:.5}}>→</span> {v.mount}
                </div>
              </div>
              <div style={{
                display:"flex",alignItems:"center",gap:8,
                fontFamily:"var(--mono)",fontSize:10.5,color:"var(--fg-2)",
                textTransform:"uppercase",letterSpacing:".08em"
              }}>
                <span style={{
                  color: v.readonly ? "var(--warn)" : "var(--ok)",
                  display:"inline-flex",alignItems:"center",gap:5
                }}>
                  <span style={{width:5,height:5,borderRadius:999,background:"currentColor"}}/>
                  {v.readonly ? "RO" : "RW"}
                </span>
              </div>
            </div>
          ))}
        </div>
      </div>

      {sel && (
        <div className="card-section">
          <div className="sec-head">
            <div className="sec-title">Confirm</div>
            <div className="sec-hint">flush writes and lock</div>
          </div>
          <div style={{
            background:"var(--bg-0)",border:".5px solid var(--line-strong)",borderRadius:"var(--radius)",
            padding:"var(--s4)"
          }}>
            <dl className="kv" style={{gridTemplateColumns:"auto 1fr",rowGap:4}}>
              <dt>volume</dt><dd>{sel.name}</dd>
              <dt>source</dt><dd>{sel.source}</dd>
              <dt>mount</dt><dd>{sel.mount}</dd>
              <dt>mode</dt><dd>{sel.readonly ? "read-only" : "read/write"}</dd>
            </dl>
          </div>
        </div>
      )}

      <div className="card-foot">
        <div className="foot-hint"></div>
        <div className="foot-actions">
          <button className="btn btn-primary" disabled={!sel} onClick={() => sel && onUnmount(sel.id)}>
            <Icon.Eject/> Unmount &amp; lock <span className="btn-kbd">⌘⏎</span>
          </button>
        </div>
      </div>
    </div>
  );
}

Object.assign(window, { CreateView, MountView, UnmountView, Field, Segmented, PassphraseInput, Toggle, AuthBlock, KeyFilePicker });

/* ─── MANAGE (mounted volumes + mount form) ───────────────────── */

function ManageView({ backend, volumes, onMount, onUnmount }) {
  const [selectedId, setSelectedId] = useState(null);
  const sel = volumes.find(v => v.id === selectedId) || null;

  // Clear selection if the selected volume disappears (was unmounted)
  useEffect(() => {
    if (selectedId && !volumes.find(v => v.id === selectedId)) setSelectedId(null);
  }, [volumes, selectedId]);

  return (
    <>
      {/* ─── Mounted volumes ───────────────────────────────── */}
      <div className="card" style={{marginBottom:"var(--s5)"}}>
        <div className="card-section">
          <div className="sec-head">
            <div className="sec-title">Mounted volumes</div>
            <div className="sec-hint">{volumes.length} {volumes.length === 1 ? "volume" : "volumes"} · click to manage</div>
          </div>

          {volumes.length === 0 ? (
            <div style={{
              padding:"var(--s5) var(--s4)",textAlign:"center",
              border:".5px dashed var(--line-strong)",borderRadius:"var(--radius)",
              background:"var(--bg-0)"
            }}>
              <div style={{
                width:40,height:40,borderRadius:10,margin:"0 auto var(--s3)",
                background:"var(--bg-2)",display:"grid",placeItems:"center",color:"var(--fg-3)"
              }}>
                <Icon.Lock/>
              </div>
              <div style={{fontSize:13,fontWeight:600,color:"var(--fg-1)",marginBottom:4}}>Nothing mounted yet</div>
              <div style={{fontSize:11.5,color:"var(--fg-3)",lineHeight:1.5}}>
                Unlock a container below to mount it here.
              </div>
            </div>
          ) : (
            <div style={{display:"flex",flexDirection:"column",gap:8}}>
              {volumes.map(v => {
                const isSel = selectedId === v.id;
                return (
                  <div key={v.id} style={{
                    border:".5px solid " + (isSel ? "var(--accent)" : "var(--line-strong)"),
                    background: isSel ? "var(--accent-soft)" : "var(--bg-0)",
                    borderRadius:"var(--radius)",
                    transition:"background .12s, border-color .12s",
                    overflow:"hidden",
                  }}>
                    <div
                      onClick={() => setSelectedId(isSel ? null : v.id)}
                      style={{
                        display:"grid",gridTemplateColumns:"auto 1fr auto",gap:14,alignItems:"center",
                        padding:"12px 14px",cursor:"default",
                      }}
                    >
                      <div style={{
                        width:32,height:32,borderRadius:8,background:"var(--accent-soft)",
                        display:"grid",placeItems:"center",color:"var(--accent-2)"
                      }}><Icon.LockOpen/></div>
                      <div style={{minWidth:0}}>
                        <div style={{fontFamily:"var(--mono)",fontSize:13,fontWeight:600,color:"var(--fg-0)",marginBottom:2,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{v.name}</div>
                        <div style={{fontFamily:"var(--mono)",fontSize:11,color:"var(--fg-3)",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>
                          {v.source} <span style={{opacity:.5}}>→</span> {v.mount}
                        </div>
                      </div>
                      <div style={{
                        display:"flex",alignItems:"center",gap:10,
                        fontFamily:"var(--mono)",fontSize:10.5,color:"var(--fg-2)",
                        textTransform:"uppercase",letterSpacing:".08em"
                      }}>
                        <span style={{
                          color: v.readonly ? "var(--warn)" : "var(--ok)",
                          display:"inline-flex",alignItems:"center",gap:5
                        }}>
                          <span style={{width:5,height:5,borderRadius:999,background:"currentColor"}}/>
                          {v.readonly ? "RO" : "RW"}
                        </span>
                        <span style={{opacity:.5,transform: isSel ? "rotate(90deg)" : "none",transition:"transform .15s",display:"inline-flex"}}>
                          <Icon.Chevron/>
                        </span>
                      </div>
                    </div>

                    {isSel && (
                      <div style={{
                        borderTop:".5px solid var(--line)",
                        padding:"var(--s4)",
                        background:"var(--bg-0)",
                        display:"flex",alignItems:"center",justifyContent:"space-between",gap:"var(--s4)",flexWrap:"wrap"
                      }}>
                        <dl className="kv" style={{gridTemplateColumns:"auto 1fr",rowGap:4,margin:0,flex:1,minWidth:220}}>
                          {v.cipher && <><dt>cipher</dt><dd>{v.cipher}</dd></>}
                          <dt>mode</dt><dd>{v.readonly ? "read-only" : "read/write"}</dd>
                        </dl>
                        <button
                          className="btn btn-primary"
                          onClick={() => onUnmount(v.id)}
                        >
                          <Icon.Eject/> Unmount &amp; lock
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
            </div>
          )}
        </div>
      </div>

      {/* ─── Mount new volume (reuse MountView) ───────────── */}
      <div style={{
        display:"flex",alignItems:"center",gap:"var(--s3)",
        margin:"0 0 var(--s4)",color:"var(--fg-2)",
        fontSize:11,textTransform:"uppercase",letterSpacing:".12em",fontWeight:600
      }}>
        <span style={{flex:1,height:1,background:"var(--line)"}}/>
        <span>Mount a volume</span>
        <span style={{flex:1,height:1,background:"var(--line)"}}/>
      </div>

      <MountView backend={backend} onMount={onMount}/>
    </>
  );
}

Object.assign(window, { ManageView });


/* ─── app.jsx ──────────────────────────────────────────────── */
// app.jsx — Lurker shell (stateless UI; only mounted-volume list is state)

// (useState/useEffect/useMemo already destructured above)

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "dark",
  "backend": "linux",
  "density": "regular"
}/*EDITMODE-END*/;

// Seed: one volume already mounted, to demonstrate mount status
const initialVolumes = [
  {
    id: "v1",
    name: "archive",
    source: "~/vaults/archive.luks",
    mount: "/mnt/archive",
    cipher: "AES",
    readonly: false,
    sourceKind: "file",
  },
];

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const [view, setView] = useState("manage");
  const [volumes, setVolumes] = useState(initialVolumes);
  const [toasts, setToasts] = useState([]);

  // When backend changes, fix the seed sample to match OS conventions
  useEffect(() => {
    setVolumes(vs => vs.map(v => {
      if (v.id !== "v1") return v;
      if (t.backend === "mac") {
        return { ...v, source: "~/vaults/archive.dmg", mount: "/Volumes/archive" };
      }
      return { ...v, source: "~/vaults/archive.luks", mount: "/mnt/archive" };
    }));
  }, [t.backend]);

  const pushToast = (toast) => {
    const id = Math.random().toString(36).slice(2);
    setToasts(ts => [...ts, { id, ...toast }]);
    setTimeout(() => setToasts(ts => ts.filter(x => x.id !== id)), 2800);
  };

  const onCreate = ({ target, size, cipher }) => {
    pushToast({ kind: "ok", t: "Container created", d: `${target}${size !== "—" ? " · " + size : ""}` });
    setView("manage");
  };

  const onMount = (v) => {
    setVolumes(vs => [v, ...vs]);
    pushToast({ kind: "ok", t: "Volume mounted", d: `${v.name} → ${v.mount}` });
  };

  const onUnmount = (id) => {
    const v = volumes.find(x => x.id === id);
    if (!v) return;
    setVolumes(vs => vs.filter(x => x.id !== id));
    pushToast({ kind: "info", t: "Volume unmounted", d: `${v.name} · locked` });
  };

  useEffect(() => {
    const onKey = (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === "1") { e.preventDefault(); setView("create"); }
      if ((e.metaKey || e.ctrlKey) && e.key === "2") { e.preventDefault(); setView("manage"); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const isLinux = t.backend === "linux";
  const title = {
    create:  "Create encrypted container",
    manage:  "Manage volumes",
  }[view];
  const subtitle = {
    create:  "Make a new encrypted file or partition.",
    manage:  "Mounted volumes, and unlock new ones.",
  }[view];

  const rootStyle = {
    "--density": t.density === "compact" ? 0.88 : t.density === "comfy" ? 1.12 : 1,
  };

  return (
    <div className="app" style={rootStyle} data-theme={t.theme}>
      <div className="titlebar">
        <div className="tb-left">
          <span className="tb-dot"/>
          <span className="tb-title">Lurker</span>
          <span className="tb-status">— {volumes.length} mounted · {isLinux ? "Linux" : "macOS"}</span>
        </div>
        <div className="tb-ctrls">
          <button className="tb-btn"><Icon.Min/></button>
          <button className="tb-btn"><Icon.Max/></button>
          <button className="tb-btn close"><Icon.CloseW/></button>
        </div>
      </div>

      <div className="body">
        <aside className="side">
          <div className="brand">
            <div className="brand-mark">
              <div className="brand-glyph"><Icon.Shield/></div>
              <div style={{display:"flex",flexDirection:"column"}}>
                <span className="brand-name">Lurker</span>
                <span className="brand-tag">{isLinux ? "LUKS · VeraCrypt" : "Apple · VeraCrypt"}</span>
              </div>
            </div>
          </div>

          <div className="nav-label">Actions</div>
          <div className="nav-group">
            <NavItem active={view==="create"} onClick={() => setView("create")} icon={<Icon.Plus/>}     kbd="⌘1" label="Create"/>
            <NavItem active={view==="manage"} onClick={() => setView("manage")} icon={<Icon.LockOpen/>} kbd="⌘2" label="Manage"/>
          </div>

        </aside>

        <main className="main">
          <div className="main-hd">
            <div className="work-wrap">
              <div style={{flex:1,minWidth:0}}>
                <h1 className="main-title">{title}</h1>
                <p className="main-sub">{subtitle}</p>
              </div>
              <div className="actions">
                <button
                  className="icon-round"
                  title={`Switch to ${t.theme === "dark" ? "light" : "dark"} mode`}
                  onClick={() => setTweak("theme", t.theme === "dark" ? "light" : "dark")}
                  aria-label={t.theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}
                >
                  {t.theme === "dark" ? <Icon.Sun/> : <Icon.Moon/>}
                </button>
              </div>
            </div>
          </div>

          <div className="main-scroll">
            <div className="work-wrap" style={{position:"relative"}}>
              <div className="glow"/>
              {view === "create" && <CreateView backend={t.backend} onCreate={onCreate}/>}
              {view === "manage" && <ManageView backend={t.backend} volumes={volumes} onMount={onMount} onUnmount={onUnmount}/>}
            </div>
          </div>
        </main>
      </div>

      <div className="toasts">
        {toasts.map(x => (
          <div key={x.id} className="toast" data-kind={x.kind}>
            <span className="dot"/>
            <div style={{display:"flex",flexDirection:"column",gap:2}}>
              <span className="t">{x.t}</span>
              <span className="d">{x.d}</span>
            </div>
          </div>
        ))}
      </div>

      <TweaksPanel>
        <TweakSection label="Theme"/>
        <TweakRadio label="Mode" value={t.theme}
          options={["dark","light"]}
          onChange={v => setTweak("theme", v)}/>
        <TweakSection label="Backend"/>
        <TweakRadio label="OS" value={t.backend}
          options={["linux","mac"]}
          onChange={v => setTweak("backend", v)}/>
        <TweakSection label="Density"/>
        <TweakRadio label="Size" value={t.density}
          options={["compact","regular","comfy"]}
          onChange={v => setTweak("density", v)}/>
      </TweaksPanel>
    </div>
  );
}

function NavItem({ icon, label, kbd, active, onClick }) {
  return (
    <div className="nav-item" data-active={!!active} onClick={onClick}>
      <span className="nav-ico">{icon}</span>
      <span>{label}</span>
      {kbd && <span className="nav-kbd">{kbd}</span>}
    </div>
  );
}

function VolCard({ v, selectable, selected, onClick }) {
  return (
    <div className="vol" data-selected={selected} onClick={onClick}>
      <div className="vol-top">
        <div className="vol-icon"><Icon.LockOpen/></div>
        <div className="vol-name">{v.name}</div>
        <div className="vol-state" style={{color: v.readonly ? "var(--warn)" : "var(--ok)"}}>
          <span className="dot"/>
          {v.readonly ? "RO" : "RW"}
        </div>
      </div>
      <div className="vol-meta">
        <div><b>source</b>{v.source}</div>
        <div><b>mount</b>{v.mount}</div>
        {v.cipher && <div><b>cipher</b>{v.cipher}</div>}
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);

</script>

</body>
</html>
